[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zelforge"
version = "0.1.0"
description = "CLI-first productivity toolkit rebuilt from the Zel tool suite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
]

[project.scripts]
zel = "zelforge.cli:cli"
zelforge = "zelforge.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
