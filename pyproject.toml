[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zelforge"
version = "0.1.0"
description = "CLI-first productivity toolkit rebuilt from the Zel tool suite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
]

[project.scripts]
zel = "zelforge.cli:cli"
zelforge = "zelforge.cli:cli"
zeltimer = "zelforge.module.timer.cli:cli"
zeltask = "zelforge.module.task.cli:cli"
zeljournal = "zelforge.module.journal.cli:cli"
zelmedia = "zelforge.module.media.cli:cli"
zelscript = "zelforge.module.script.cli:cli"
zelrepo = "zelforge.module.repo.cli:cli"
zelhabit = "zelforge.module.habit.cli:cli"
zelblock = "zelforge.module.block.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
